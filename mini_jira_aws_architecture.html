<!DOCTYPE html>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; font-family: "Anthropic Sans", sans-serif; }

.arr { stroke: #888; stroke-width: 1.2; fill: none; }

.az-bg { fill: #F4FAF7; stroke: #1D9E75; stroke-width: 1; stroke-dasharray: 4 3; }

.iam-bg { fill: #FFF0F0; stroke: #D85A30; stroke-width: 1; stroke-dasharray: 4 2; }
.svc-box { rx: 6; ry: 6; }
@media (prefers-color-scheme: dark) {
  .label-title { fill: #e2e0d6; }
  .label-sub { fill: #a0a09a; }
  .label-note { fill: #888; }
  .section-label { fill: #a0a09a; }
  .vpc-bg { fill: #0d1f30; stroke: #185FA5; }

  .subnet-pub { fill: #201e00; stroke: #854F0B; }

}

</head>
